ody{margin-top:10px;display:grid;gap:10px}.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.preset{background:#ffffff0a;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 4px;cursor:pointer;text-align:center;transition:all .2s}.preset:hover{background:#ffffff14}.preset.on{border-color:#f0a35e99;background:#f0a35e24}.preset .pi{font-size:18px;display:block}.preset b{font-size:12px;display:block;margin-top:2px}.preset small{font-size:10.5px;color:var(--muted)}input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:99px;outline:none;cursor:pointer;background:linear-gradient(90deg,#1c2a52,#3b3a5c 22%,#f0a070 27%,#c3dcff 40%,#e6f0ff,#c3dcff 64%,#f0a070 74%,#3b3a5c 80%,#1c2a52)}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 2px 8px #0006}input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent)}.slider-scale{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:4px}.row{display:flex;gap:6px;align-items:center}.weekdays,.speeds{display:flex;gap:4px;flex:1}.weekdays button,.speeds button{flex:1;background:#ffffff0a;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:5px 0;font-size:11.5px;cursor:pointer}.weekdays button.on,.speeds button.on{color:var(--text);background:#ffffff1f}.weekdays button.match{color:#ffd6ad}.btn{flex:1;background:#ffffff12;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 10px;font-size:12.5px;cursor:pointer;transition:all .2s}.btn:hover{background:#ffffff1f}.btn.accent{background:linear-gradient(135deg,#f0a35e,#c8693a);color:#1e1206;font-weight:700;border:none}.btn.ghost{flex:none}.btn:disabled{opacity:.45;cursor:default}.icon-btn{background:#ffffff0f;border:1px solid var(--line);color:var(--muted);width:26px;height:26px;border-radius:8px;cursor:pointer;display:grid;place-items:center;font-size:13px;transition:transform .2s}.fab{display:none}#toast{position:absolute;left:50%;bottom:26px;transform:translate(-50%);padding:8px 14px;border-radius:99px;background:#0c101ae6;border:1px solid var(--line);font-size:12.5px;opacity:0;transition:opacity .3s;pointer-events:none}#toast.show{opacity:1}#boot{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--muted);font-size:14px;letter-spacing:2px;transition:opacity .6s;z-index:50}#boot.done{opacity:0;pointer-events:none}@media(max-width:1180px)and (min-width:761px){#board{width:320px}#topbar{right:350px}#match{width:420px}}@media(max-width:760px){#topbar{top:max(10px,env(safe-area-inset-top));left:12px;right:12px;gap:8px 12px}.brand-sub,.chip.ghost{display:none}.logo{width:32px;height:32px;font-size:16px;border-radius:9px}.brand-title{font-size:15px}.clock-time{font-size:22px}.clock{margin-left:auto;text-align:right}.clock-date{justify-content:flex-end}.chips{width:100%;gap:6px}.chip{font-size:11.5px;padding:5px 10px}#board{inset:auto 0 0;width:auto;height:72vh;border-radius:18px 18px 0 0;transform:translateY(calc(72vh - 176px));transition:transform .35s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}#board.open{transform:none}.drawer-handle{display:block;padding:8px 0 2px;cursor:grab}.drawer-handle span{display:block;width:42px;height:5px;border-radius:99px;background:#ffffff40;margin:0 auto}.board-head{padding:6px 14px 8px}.board-tools{margin-top:6px}#card{inset:auto 8px 8px;width:auto;max-height:64vh;z-index:20;border-radius:18px}#match{left:8px;right:8px;top:110px;transform:none;width:auto;z-index:15}.mlines{max-height:22vh}.score{padding:10px 12px 4px}.score .k{font-size:24px}#review{left:8px;right:8px;bottom:184px;width:auto;z-index:30;display:none}#review.mobile-open{display:block}.fab{display:grid;place-items:center;position:absolute;right:12px;bottom:190px;width:4   </head>
  <body>
    <div id="app">
      <div id="stage"></div>

      <!-- 顶部信息 -->
      <header id="topbar">
        <div class="brand">
          <div class="logo">峡</div>
          <div>
            <div class="brand-title">峡谷打工人</div>
            <div class="brand-sub">英雄联盟办公室 · 迷你世界</div>
          </div>
        </div>
        <div class="clock">
          <div class="clock-time" id="clockTime">--:--</div>
          <div class="clock-date"><span id="clockDate">--</span><span class="live-badge" id="liveBadge">● 实时</span></div>
        </div>
        <div class="chips">
          <div class="chip" id="phaseChip">--</div>
          <div class="chip accent" id="statusChip">--</div>
          <div class="chip ghost" id="viewerChip" title="旁观人数（样板占位数据）">👀 -- 人在围观</div>
        </div>
      </header>

      <!-- 事件板（桌面在右侧；手机竖屏为底部抽屉） -->
      <aside id="board" class="panel">
        <div class="drawer-handle" id="drawerHandle"><span></span></div>
        <div class="board-head">
          <div class="board-title">事件板 <small id="boardCount"></small></div>
          <div class="board-tools">
            <button class="seg on" data-filter="all">全部</button>
            <button class="seg" data-filter="fun">有趣以上</button>
            <label class="toggle"><input type="checkbox" id="foldDaily" checked /> 折叠日常</label>
          </div>
        </div>
        <div id="pinned"></div>
        <div id="feed"></div>
      </aside>

      <!-- 人物卡片 -->
      <section id="card" class="panel hidden"></section>

      <!-- 比赛文字直播 -->
      <section id="match" class="panel hidden"></section>

      <!-- 样板审核工具（正式版没有） -->
      <section id="review" class="panel">
        <div class="review-head">
          <span>样板审核工具</span>
          <small>正式版不提供</small>
          <button class="icon-btn" id="reviewToggle" title="收起/展开">▾</button>
        </div>
        <div class="review-body">
          <div class="presets" id="presets"></div>
          <div class="slider-row">
            <input type="range" id="timeSlider" min="0" max="1439" step="1" />
            <div class="slider-scale"><span>0:00</span><span>6:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
          </div>
          <div class="row">
            <div class="weekdays" id="weekdays"></div>
          </div>
          <div class="row">
            <div class="speeds" id="speeds"></div>
            <button class="btn ghost" id="liveBtn">回到现在</button>
          </div>
          <div class="row">
            <button class="btn" id="genBtn">＋ 随机事件</button>
            <button class="btn accent" id="matchBtn">▶ 周赛文字直播（演示）</button>
          </div>
        </div>
      </section>
      <button id="reviewFab" class="fab" title="样板审核工具">🛠</button>

      <div id="toast"></div>
      <div id="boot">正在搭建办公室……</div>
    </div>
  </body>
</html>
