  else if(tac==="scaling"){if(def.t>=20)m*=1.06;else if(def.t<13)m*=0.93;}
  return m;
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

    var pool=TL_OPT.slice();
    while(base.length<n&&pool.length){
      var idx=Math.floor(rng.next()*pool.length);
      var item=pool.splice(idx,1)[0];
      var pos=0;while(pos<base.length&&base[pos].t<item.t)pos++;
      base.splice(pos,0,item);
    }
  }else{
    while(base.length>n){
      var best=-1,bd=1e9;
      for(var i2=2;i2<base.length-2;i2++){
        if(["lane","dragon","skirmish","gank"].indexOf(base[i2].key)<0)continue;
        var d=Math.abs(i2-(base.length-1)/2);
        if(d<bd){bd=d;best=i2;}
      }
      if(best<0)break;
      base.splice(best,1);
    }
  }
  return base;
}
function cloneMirror(P,ids){return ids.map(function(id){var k="x_"+id;if(!P[k]){P[k]=JSON.parse(JSON.stringify(P[id]));P[k].id=k;P[k].name=P[id].name+"′";}return k;});}
function weakenClone(P,ids,delta){return ids.map(function(id){var k="w_"+id;if(!P[k]){P[k]=JSON.parse(JSON.stringify(P[id]));P[k].id=k;P[k].name=P[id].name+"(属性-"+delta+")";for(var s in P[k].stats)P[k].stats[s]=Math.max(30,P[k].stats[s]-delta);}return k;});}
function resolveRosters(P,preset){
  var A=preset.A.slice();var B;
  if(preset.weakenOf==="A")B=weakenClone(P,preset.A,preset.delta||3);
  else if(preset.mirrorOf)B=cloneMirror(P,preset.A);
  else if(preset.cloneB)B=cloneMirror(P,preset.B);
  else B=preset.B.slice();
  return{A:A,B:B};
}
function effStats(p,opts){
  var st={};for(var k in p.stats)st[k]=p.stats[k];
  if(opts.awakened&&p.traits.indexOf("slack")>=0){st.lane+=6;st.mech+=10;st.fight+=12;st.sense+=6;st.mental+=8;}
  if(p.traits.indexOf("onegame")>=0){var m=opts.firstBuff-opts.decayStep*(opts.gameIdx-1);for(var k2 in st)st[k2]+=m;}
  return st;
}
function pick(arr,rng){return arr[Math.floor(rng.next()*arr.length)];}

function simulateMatch(P,idsA,idsB,opts,rng){
  var log=[];
  var nameA=opts.nameA||"A队",nameB=opts.nameB||"B队";
  var seq=buildSeq(opts.nodeCount,rng);
  var A=idsA.map(function(id){return P[id];});
  var B=idsB.map(function(id){return P[id];});
  var stA=A.map(function(p){return effStats(p,opts);});
  var stB=B.map(function(p){return effStats(p,opts);});
  var contrib={},nodeScores={};
  A.concat(B).forEach(function(p){contrib[p.id]=0;nodeScores[p.id]=[];});
  var km={};
  A.concat(B).forEach(function(p){
    if(p.traits.indexOf("kamikaze")>=0){
      var r=rng.next()*100;var state=r<opts.godP?2:(r>100-opts.godP?0:1);
      km[p.id]={state:state,flips:0,init:state};
      log.push({t:"tr",s:(p.name+" 今日底色："+(state===2?"神 · 天魔下凡预定了":state===0?"鬼 · 教练想按下重开键":"中立 · 薛定谔的撇干"))});
    }
  });
  var goldA=0,goldB=0,blowout=false,nodesPlayed=0,lastWinner="A";
  var nodeWinsA=0,nodeWinsB=0;
  var killsA=0,killsB=0,towersA=0,towersB=0,firstBlood=null,baronBuff=null,baronTeam=null;
  var kda={};
  A.concat(B).forEach(function(p){kda[p.id]={k:0,d:0,a:0};});
  var gameClock=0;
  var tacA=opts.tacA||null,tacB=opts.tacB||null;
  var ctrA=(tacA&&TACTICS[tacA].beats===tacB)?1.05:1;
  var ctrB=(tacB&&TACTICS[tacB].beats===tacA)?1.05:1;
  var hasOne=A.concat(B).some(function(p){return p.traits.indexOf("onegame")>=0;});
  var onegNote="";
  if(hasOne){
    var om=opts.firstBuff-opts.decayStep*(opts.gameIdx-1);
    onegNote=" · 当日第 "+opts.gameIdx+" 局（一把没 全属性"+(om>=0?"+":"")+om+"）";
  }
  A.concat(B).forEach(function(p){
    if((p.stress==null?30:p.stress)>=78)log.push({t:"tr",s:"◆ "+p.name+" 最近压力拉满，热身时都在走神（发挥受影响）"});
  });
  if(tacA||tacB){
    var tacNote="战术对位："+(TACTICS[tacA]?TACTICS[tacA].name:"无")+" vs "+(TACTICS[tacB]?TACTICS[tacB].name:"无");
    if(ctrA>1)log.push({t:"tr",s:"◆ 战术克制！"+TACTICS[tacA].name+" 天克 "+TACTICS[tacB].name+"（全场 +5%）"});
    else if(ctrB>1)log.push({t:"tr",s:"◆ 战术克制！"+TACTICS[tacB].name+" 天克 "+TACTICS[tacA].name+"（全场 +5%）"});
    onegNote+=(onegNote?" · ":"")+tacNote;
  }
  log.unshift({t:"nd",s:"比赛开始 ｜ "+nameA+" vs "+nameB+" ｜ 种子 "+rng.seed+onegNote});
  function pickAmong(scores,wantMax,type){
    var bi=-1,bv=wantMax?-1e9:1e9;
    for(var j=0;j<5;j++){
      if((type.inv[SLOTS[j]]||1)<0.9)continue;
      if(wantMax?scores[j]>bv:scores[j]<bv){bi=j;bv=scores[j];}
    }
    return bi<0?0:bi;
  }
  function playNode(def){
    var type=NODE_TYPES[def.key];
    var clock=Math.max(1,def.t+rng.gauss()*0.35);
    gameClock=clock;
    var keyNode=def.t>=20||Math.abs(goldA-goldB)>4000;
    var chaos=rng.next()<0.15;
    var sg=opts.sigma*(chaos?2.5:1)*(def.t>=20?1.5:1);
    var leadA=goldA-goldB,leadB=goldB-goldA;
    var scoresA=[],scoresB=[];
    function calc(team,st,ownLead,side,tacM){
      var out=[];
      var oppTeam=side==="A"?B:A;
      var oppSt=side==="A"?stB:stA;
      for(var j=0;j<team.length;j++){
        var p=team[j],s=st[j];
        var base=0,oBase=0;
        for(var k in type.w){base+=type.w[k]*s[k];oBase+=type.w[k]*oppSt[j][k];}
        var fit=p.fit[SLOTS[j]]||50;
        var mult=Math.max(0.6,Math.min(1,0.5+fit/200));
        var oFit=oppTeam[j].fit[SLOTS[j]]||50;
        var oMult=Math.max(0.6,Math.min(1,0.5+oFit/200));
        var eff=base*mult,oEff=oBase*oMult;
        /* 对位压制双通道：判定层几乎不影响胜负（×0.05，保平衡），
           表现层大幅转化为个人数据（×0.45）→ 高属性选手的 MVP/评级/击杀肉眼可见 */
        var pr=eff-oEff;
        var val=eff+pr*0.05;
        if(side==="A"&&type.w.lane>=0.4&&Math.abs(pr)>=10&&rng.next()<0.22){
          if(pr>0)log.push({t:"tr",s:"["+fmtClock(clock)+"] ◆ "+p.name+" 对位压制 "+oppTeam[j].name+"，刀刀入肉"});
          else log.push({t:"tr",s:"["+fmtClock(clock)+"] ◆ "+oppTeam[j].name+" 对位压制 "+p.name+"，刀刀入肉"});
        }
        if(baronBuff===side)val+=8;
        if(p.traits.indexOf("bigheart")>=0&&keyNode)val+=10;
        if(p.traits.indexOf("showoff")>=0&&(type.w.lane>=0.4||type.w.fight>=0.4))val+=8;
        if(p.traits.indexOf("scalemage")>=0){
          if(def.t>=20){val+=10;if(keyNode&&rng.next()<0.10)log.push({t:"tr",s:"["+fmtClock(clock)+"] ◆ "+p.name+" 后期接管比赛，技能框全亮"});}
          else if(def.key==="gank"||def.key==="skirmish"){val-=8;if(rng.next()<0.10)log.push({t:"tr",s:"["+fmtClock(clock)+"] ◆ "+p.name+" 看见刺客绕后，手指开始发凉"});}
        }
        if(p.traits.indexOf("shotcall")>=0){
          if(def.t<20){val+=8;if(def.key==="lane"&&rng.next()<0.08)log.push({t:"tr",s:"["+fmtClock(clock)+"] ◆ "+p.name+" 对线打出优势，顺手给对面起了个新外号"});}
          else val-=5;
        }
        if(p.traits.indexOf("streaky")>=0){
          var mo=ownLead>0?Math.min(10,ownLead/1000*1.2):Math.max(-10,ownLead/1000*1.2);
          val+=mo;
          if(Math.abs(ownLead)>=2200&&rng.next()<0.15)log.push({t:"tr",s:"["+fmtClock(clock)+"] ◆ "+p.name+(ownLead>0?" 顺风局指挥声都大了三分，抓机会手到擒来":" 语音陷入沉默，打野路线开始迷茫")});
        }
        /* 压力：>60 开始影响发挥（每点 -0.12），<22 心态放松小幅加成 */
        var strs=p.stress==null?30:p.stress;
        if(strs>60)val-=(strs-60)*0.12;
        else if(strs<22)val+=2;
        /* 疲劳：连续上场累积（上场+12/场，替补-40），>40 开始影响发挥（每点 -0.09） */
        var fat=p.fatigue==null?0:p.fatigue;
        if(fat>40)val-=(fat-40)*0.09;
        if(km[p.id])val+=(km[p.id].state===2?12:km[p.id].state===0?-15:0);
        if(p.traits.indexOf("goof")>=0&&ownLead>2000&&rng.next()<0.10){val-=25;log.push({t:"tr",s:"["+fmtClock(clock)+"] ◆ "+p.name+" 优势太大开始整活：塔下跳舞被反杀（贡献 -25）"});}
        val*=tacM;
        val+=ownLead/1000*opts.snowball;
        var inv=type.inv[SLOTS[j]]||1;
        val=val*inv+rng.gauss()*sg*inv;
        contrib[p.id]+=val+pr*0.45*inv;nodeScores[p.id].push(val+pr*0.45*inv);
        out.push(val);
      }
      return out;
    }
    scoresA=calc(A,stA,leadA,"A",tacMult(tacA,def,type,lastWinner,"A",nodesPlayed)*ctrA);
    scoresB=calc(B,stB,leadB,"B",tacMult(tacB,def,type,lastWinner,"B",nodesPlayed)*ctrB);
    baronBuff=null;
    var sumA=scoresA.reduce(function(a,b){return a+b;},0);
    var sumB=scoresB.reduce(function(a,b){return a+b;},0);
    var winner=sumA>sumB?"A":(sumB>sumA?"B":(rng.next()<0.5?"A":"B"));
    lastWinner=winner;
    if(winner==="A")nodeWinsA++;else nodeWinsB++;
    var margin=Math.abs(sumA-sumB);
    var isFinal=def.key==="final";
    var leadNow=Math.abs(goldA-goldB);
    var wName=winner==="A"?nameA:nameB;
    /* 击杀产出：kMin~kMax 为该节点两队合计人头，胜方按优势吃大头。
       逐杀记账进 kda（谁杀谁/谁助攻当场直播），计分板直接汇总 → 直播与面板一一对应 */
    var kAll=type.kMin+Math.floor(rng.next()*(type.kMax-type.kMin+1));
    var wShare=0.55+Math.min(0.35,margin/90);
    var wk=Math.round(kAll*wShare),lk=kAll-wk;
    var nodeDead={},nodeD={},streak={};
    if(kAll>0){
      var kwA=killW(A,contrib),kwB=killW(B,contrib);
      var dwA=deathW(A,contrib),dwB=deathW(B,contrib);
      var awA=assistW(A,contrib),awB=assistW(B,contrib);
      for(var q=0;q<kAll;q++){
        var ks=q<wk?winner:(winner==="A"?"B":"A");
        var vs=ks==="A"?"B":"A";
        var kTeam=ks==="A"?A:B,vTeam=vs==="A"?A:B;
        var ki=wPick(ks==="A"?kwA:kwB,rng);
        var killer=kTeam[ki];
        var alive=[];for(var vj=0;vj<5;vj++){if(!nodeDead[vTeam[vj].id])alive.push(vj);}
        if(!alive.length){alive=[0,1,2,3,4];nodeDead={};}
        var vSel=alive[wPick(alive.map(function(x){return (vs==="A"?dwA:dwB)[x];}),rng)];
        var victim=vTeam[vSel];
        nodeDead[victim.id]=true;nodeD[victim.id]=(nodeD[victim.id]||0)+1;
        kda[killer.id].k++;kda[victim.id].d++;
        streak[killer.id]=(streak[killer.id]||0)+1;
        var u=rng.next();
        var na=u<0.08?0:(u<0.32?1:(u<0.65?2:3));
        var pool=[0,1,2,3,4].filter(function(x){return x!==ki;});
        var aNs=[];
        for(var a2=0;a2<na&&pool.length;a2++){
          var ai=wPick(pool.map(function(x){return (ks==="A"?awA:awB)[x];}),rng);
          kda[kTeam[pool[ai]].id].a++;
          aNs.push(kTeam[pool[ai]].name);
          pool.splice(ai,1);
        }
        if(!firstBlood){
          firstBlood=killer.name;
          if(ks==="A")goldA+=300;else goldB+=300;
          log.push({t:"hl",s:"["+fmtClock(clock)+"] ★ 一血！"+killer.name+" 击杀 "+victim.name+"（+300g）"});
        }else{
          log.push({t:"tr",s:"["+fmtClock(clock)+"] ⚔ "+killer.name+" 击杀 "+victim.name+(aNs.length?"（"+aNs.join("、")+" 助攻）":"")});
        }
        var stN=streak[killer.id];
        if(stN===2)log.push({t:"hl",s:"["+fmtClock(clock)+"] 🔥 "+killer.name+" 双杀！"});
        else if(stN===3)log.push({t:"hl",s:"["+fmtClock(clock)+"] 🔥 "+killer.name+" 三杀！"});
        else if(stN===4)log.push({t:"hl",s:"["+fmtClock(clock)+"] 🔥🔥 "+killer.name+" 四杀！！"});
        else if(stN>=5)log.push({t:"hl",s:"["+fmtClock(clock)+"] 🔥🔥🔥 PENTA KILL！"+killer.name+" 五杀收尾！！！"});
      }
      var deadA=0,deadB=0;
      A.forEach(function(p){if(nodeDead[p.id])deadA++;});
      B.forEach(function(p){if(nodeDead[p.id])deadB++;});
      if(deadA===5||deadB===5)log.push({t:"hl",s:"["+fmtClock(clock)+"] 💀 "+(deadA===5?nameB:nameA)+" 打出团灭（ACE）"});
    }
    /* 推塔 */
    var tw=type.twMin+Math.floor(rng.next()*(type.twMax-type.twMin+1));
    if(winner==="A")towersA+=tw;else towersB+=tw;
    /* 经济：final 一锤定音，20min 后资源团大额 */
    var gain,loserGain;
    if(isFinal){
      gain=2800+Math.min(Math.round(margin*2),800);loserGain=900;
    }else if(def.t>=22){
      gain=1500+Math.min(Math.round(margin*3),600);
      loserGain=650+Math.min(800,Math.floor(leadNow/2000)*300);
    }else{
      gain=450+Math.min(Math.round(margin*5),700);
      gain=Math.round(gain*(1-Math.min(0.4,leadNow/12000)));
      loserGain=350+Math.min(600,Math.floor(leadNow/2500)*300);
    }
    if(winner==="A"){goldA+=gain;goldB+=loserGain;}else{goldB+=gain;goldA+=loserGain;}
    nodesPlayed++;
    var wTeam=winner==="A"?A:B,wScores=winner==="A"?scoresA:scoresB;
    var lTeam=winner==="A"?B:A,lScores=winner==="A"?scoresB:scoresA;
    var hi=pickAmong(wScores,true,type);
    var lo=pickAmong(lScores,false,type);
    log.push({t:"nd",s:"["+fmtClock(clock)+"] "+type.name+" ｜ "+nameA+" "+sumA.toFixed(1)+" : "+sumB.toFixed(1)+" "+nameB+" ｜ "+wName+" +"+gain+"g（经济 "+(winner==="A"?"A":"B")+" "+(goldA-goldB>=0?"+":"")+(goldA-goldB)+"）"});
    if(chaos)log.push({t:"tr",s:"["+fmtClock(clock)+"] ⚡ 大乱斗：十个人中路大乱斗，这波谁也说不准（波动 ×2.5）"});
    if(def.key==="baron"){baronTeam=winner;baronBuff=winner;log.push({t:"tr",s:"["+fmtClock(clock)+"] ◆ "+wName+" 拿下大龙，全员强化（下一节点战力 +8）"});}
    if(def.key==="herald")log.push({t:"tr",s:"["+fmtClock(clock)+"] ◆ "+wName+" 拿下峡谷先锋"+(tw>0?"，先锋撞塔推掉 "+tw+" 座":"")});
    else if(tw>=2)log.push({t:"tr",s:"["+fmtClock(clock)+"] ◆ "+wName+" 推掉 "+tw+" 座防御塔"});
    log.push({t:"hl",s:"["+fmtClock(clock)+"] ★ 高光："+wTeam[hi].name+" "+pick(HL[def.key],rng)});
    var worstId=null,worstN=0;
    A.concat(B).forEach(function(p){var n=nodeD[p.id]||0;if(n>worstN){worstN=n;worstId=p.id;}});
    if(worstId){
      log.push({t:"bl",s:"["+fmtClock(clock)+"] ✗ 黑洞："+P[worstId].name+" "+pick(BL,rng)+(worstN>=2?"（本节点送出 "+worstN+" 头）":"")});
    }else{
      log.push({t:"bl",s:"["+fmtClock(clock)+"] ✗ 黑洞："+lTeam[lo].name+" "+pick(BL_SAFE,rng)});
    }
    A.concat(B).forEach(function(p,idx){
      if(km[p.id]){
        var myScore=(idx<5?scoresA:scoresB)[idx%5];
        var oppScore=(idx<5?scoresB:scoresA)[idx%5];
        var d=myScore-oppScore;
        if(d<=-12&&km[p.id].state>0&&rng.next()<0.35){km[p.id].state--;km[p.id].flips++;log.push({t:"tr",s:"["+fmtClock(clock)+"] ◆ "+p.name+" 被针对崩了，开始青铜表演（全属性 -15）"});}
        else if(d>=12&&km[p.id].state<2&&rng.next()<0.35){km[p.id].state++;km[p.id].flips++;log.push({t:"tr",s:"["+fmtClock(clock)+"] ◆ "+p.name+" 杀疯了！切换天魔形态（全属性 +12）"});}
      }
    });
    return isFinal;
  }
  for(var i=0;i<seq.length;i++){
    var wasFinal=playNode(seq[i]);
    if(!wasFinal&&seq[i].t>=20&&Math.abs(goldA-goldB)>=5200){
      blowout=true;gameClock+=0.3+rng.next()*0.7;
      log.push({t:"nd",s:"["+fmtClock(gameClock)+"] 经济差 "+Math.abs(goldA-goldB)+"，"+(Math.abs(goldA-goldB)>8000?"打出 GG，提前结束":"大势已去，提前结束")});
      break;
    }
  }
  /* 均势延长：终局经济差 <2500 → 远古龙团 31:00，仍胶着 → 最后的决战 35:00 */
  var ext=0;
  while(!blowout&&Math.abs(goldA-goldB)<2500&&ext<2){
    ext++;
    playNode(ext===1?{key:"elder",t:31}:{key:"final",t:35});
  }
  var win=goldA>goldB?"A":(goldB>goldA?"B":lastWinner);
  var winTeam=win==="A"?A:B;
  var mvp=winTeam[0],mvpScore=-1e9;
  for(var j4=0;j4<5;j4++){
    var sc=contrib[winTeam[j4].id]*(0.9+0.2*rng.next());
    if(sc>mvpScore){mvpScore=sc;mvp=winTeam[j4];}
  }
  killsA=0;killsB=0;
  A.forEach(function(p){killsA+=kda[p.id].k;});
  B.forEach(function(p){killsB+=kda[p.id].k;});
  if(killsA===0||killsB===0){
    var sad=killsA===0?"A":"B";
    var sTeam=sad==="A"?A:B,oTeam=sad==="A"?B:A;
    var sKi=wPick(killW(sTeam,contrib),rng);
    var sVi=wPick(deathW(oTeam,contrib),rng);
    kda[sTeam[sKi].id].k++;kda[oTeam[sVi].id].d++;
    if(sad==="A")killsA=1;else killsB=1;
    log.push({t:"tr",s:"["+fmtClock(gameClock)+"] "+sTeam[sKi].name+" 终场前挽回颜面，拿下安慰杀"});
  }
  var gameLen=gameClock+(blowout?0.2:0.8+rng.next()*2);
  log.push({t:"nd",s:"比赛结束 ｜ "+(win==="A"?nameA:nameB)+" 胜 · 时长 "+fmtClock(gameLen)+" ｜ 经济差 "+Math.abs(goldA-goldB)+" ｜ 推塔 "+towersA+"-"+towersB+" ｜ 击杀 "+killsA+"-"+killsB+" ｜ MVP："+mvp.name});
  var box=buildBox(P,idsA,idsB,nodeScores,contrib,mvp.id,rng,km,{killsA:killsA,killsB:killsB,kda:kda,nodeWinsA:nodeWinsA,nodeWinsB:nodeWinsB});
  return{win:win,nodes:nodesPlayed,blowout:blowout,goldA:goldA,goldB:goldB,mvpId:mvp.id,contrib:contrib,nodeScores:nodeScores,km:km,log:log,box:box,
    gameLen:gameLen,towersA:towersA,towersB:towersB,killsA:killsA,killsB:killsB,firstBlood:firstBlood,baronTeam:baronTeam};
}

/* ── 计分板 v3：逐杀记账 ──
   K/D/A 全部来自 simulateMatch 里逐杀分配的事件账本（ctx.kda），
   直播里每条击杀行/一血/多杀/安慰杀都会如实累进账本 → 面板与直播一一对应。
   参团率=(K+A)/全队击杀×100%；KDA=(K+A)/D（口径对齐真实比赛） */
var POS_KILL={top:.9,jgl:.8,mid:1.15,adc:1.35,sup:.2};
var POS_DEATH={top:1.2,jgl:1.15,mid:1,adc:1,sup:.85};

function wPick(w,rng){
  var s=0;for(var i=0;i<w.length;i++)s+=w[i];

function _normOf(team,contrib,j){
  var ts=0;team.forEach(function(p){ts+=contrib[p.id]||0;});ts=Math.max(1,ts);
  return Math.min(1.5,Math.max(0.4,(contrib[team[j].id]||0)/ts*5));

function killW(team,contrib){return team.map(function(p,j){return Math.max(0.05,Math.pow(_normOf(team,contrib,j),1.7)*POS_KILL[SLOTS[j]]);});}
function deathW(team,contrib){return team.map(function(p,j){return Math.max(0.25,POS_DEATH[SLOTS[j]]*(1.28-0.45*_normOf(team,contrib,j)));});}
function assistW(team,contrib){return team.map(function(p,j){return Math.max(0.1,POS_ASSIST[SLOTS[j]]*(0.75+0.25*_normOf(team,contrib,j)));});}
function buildBox(P,idsA,idsB,nodeScores,contrib,mvpId,rng,km,ctx){
  var allIds=idsA.concat(idsB);
  var avgMap={};
  allIds.forEach(function(id){
    var a=nodeScores[id]||[];var s=0;for(var i=0;i<a.length;i++)s+=a[i];
    avgMap[id]=a.length?s/a.length:0;
  });
  var sorted=allIds.slice().sort(function(x,y){return avgMap[y]-avgMap[x];});
  var rankMap={};sorted.forEach(function(id,i){rankMap[id]=i;});
  var sideMap={},sums={A:0,B:0};
  idsA.forEach(function(id){sideMap[id]="A";});
  idsB.forEach(function(id){sideMap[id]="B";});
  allIds.forEach(function(id){sums[sideMap[id]]+=contrib[id]||0;});
  var kda=(ctx&&ctx.kda)||{};
  var teamKills={A:0,B:0};
  idsA.forEach(function(id){teamKills.A+=(kda[id]?kda[id].k:0);});
  idsB.forEach(function(id){teamKills.B+=(kda[id]?kda[id].k:0);});
  return allIds.map(function(id,idx){
    var p=P[id];var r=rankMap[id];
    var grade=r<2?"S":r<4?"A":r<6?"B":r<8?"C":"D";
    var side=sideMap[id];
    var kk=kda[id]?kda[id].k:0,dd=kda[id]?kda[id].d:0,aa=kda[id]?kda[id].a:0;
    var join=teamKills[side]>0?Math.min(100,Math.round((kk+aa)/teamKills[side]*100)):0;
    var share=sums[side]>0?((contrib[id]||0)/sums[side]*100):0;
    return{id:id,name:p.name,slot:SLOTS[idx%5],side:side,k:kk,d:dd,a:aa,join:join,
      share:share,contrib:Math.round(contrib[id]||0),grade:grade,mvp:id===mvpId,
      kami:km&&km[id]?["鬼","中立","神"][km[id].state]:null};
  });
}

function simulateBatch(P,idsA,idsB,opts,n,baseSeed){
  var r={n:0,winsA:0,winsB:0,nodes:0,blowouts:0,diffSum:0,mvp:{},kmInit:{2:0,1:0,0:0},kmWins:{2:0,1:0,0:0},kmGames:{2:0,1:0,0:0},flips:0};
  for(var i=0;i<n;i++){
    var rng=makeRng(baseSeed+i*7919);
    var m=simulateMatch(P,idsA,idsB,opts,rng);
    r.n++;if(m.win==="A")r.winsA++;else r.winsB++;
    r.nodes+=m.nodes;if(m.blowout)r.blowouts++;
    r.diffSum+=Math.abs(m.goldA-m.goldB);
    r.mvp[m.mvpId]=(r.mvp[m.mvpId]||0)+1;
    for(var pid in m.km){
      var st=m.km[pid];r.kmInit[st.init]++;r.kmGames[st.init]++;r.flips+=st.flips;
      var isA=idsA.indexOf(pid)>=0;
      if((isA&&m.win==="A")||(!isA&&m.win==="B"))r.kmWins[st.init]++;
    }
  }
  r.avgNodes=r.nodes/r.n;r.blowoutRate=r.blowouts/r.n;r.avgDiff=r.diffSum/r.n;
  return r;
}

function roundRobin(n){
  var arr=[],rounds=[],r,k;
  for(var i=0;i<n;i++)arr.push(i);
  for(r=0;r<n-1;r++){
    var pairs=[];
    for(k=0;k<n/2;k++){
      var a=arr[k],b=arr[n-1-k];
      pairs.push(r%2===0?[a,b]:[b,a]);
    }
    rounds.push(pairs);
    arr.splice(1,0,arr.pop());
  }
  return rounds;
}

    if(p.traits.indexOf("onegame")>=0)mult*=0.7;
    for(var k in p.stats){

      if(room>0)p.stats[k]=Math.min(p.potential,p.stats[k]+room*0.022*mult+rng.next()*0.15*mult);

  });

   fx:function(P,ids,rng){var a=pick2(P,ids,rng);var rest=ids.filter(function(x){return x!==a.id;});var b=P[pick(rest,rng)];var ka=STAT_KEYS[Math.floor(rng.next()*7)],kb=STAT_KEYS[Math.floor(rng.next()*7)];statUp(a,ka,4);statUp(b,kb,4);addStress(P,ids,-8);return "★ "+a.name+" "+STAT_NAME[ka]+"+4、"+b.name+" "+STAT_NAME[kb]+"+4 · 全员压力 -8";}},
  {w:1,name:"更衣室爆炸",text:"战术分歧引爆更衣室，摔了两个鼠标。",
   fx:function(P,ids,rng){ids.forEach(function(id){statUp(P[id],"mental",-5);});addStress(P,ids,15);return "⚠️ 全员心态 -5 · 压力 +15";}},
  {w:1,name:"版本红利",text:"新版本恰好加强了你们的战术体系，练了两周的套路突然成了版本答案。",
   fx:function(P,ids,rng){ids.forEach(function(id){statUp(P[id],"fight",4);statUp(P[id],"pool",3);});addStress(P,ids,-5);return "★ 全员团战 +4 英雄池 +3 · 压力 -5";}},
  {w:1,name:"集体食物中毒",text:"庆功宴的生蚝出了问题，全员在医院挂水。",
   fx:function(P,ids,rng){allUp(P,ids,-4);addStress(P,ids,8);return "⚠️ 全员全属性 -4 · 压力 +8";}},
  {w:1,name:"赞助商神仙福利",text:"赞助商年底冲量，发了一波神仙福利。",
   fx:function(P,ids,rng){ids.forEach(function(id){statUp(P[id],"pool",6);});addStress(P,ids,-12);return "★ 全员英雄池 +6 · 压力 -12";}},
  {w:1,name:"训练赛十连败",text:"约的训练赛连输十把，越打越迷。",
   fx:function(P,ids,rng){ids.forEach(function(id){statUp(P[id],"lane",-3);statUp(P[id],"sense",-3);});addStress(P,ids,12);return "⚠️ 全员对线 -3 意识 -3 · 压力 +12";}},
  {w:2,name:"职业队集训营",text:"被 RGS 邀去合练了三天，回来整个人都不一样了。",
   fx:function(P,ids,rng){ids.forEach(function(id){statUp(P[id],"mech",3);statUp(P[id],"sense",3);});addStress(P,ids,8);return "★ 全员操作 +3 意识 +3 · 压力 +8";}}
];
function rollEvent(P,ids,rng){
  var total=0;EVENTS.forEach(function(e){total+=e.w;});
  var r=rng.next()*total,ev=EVENTS[0];
  for(var i=0;i<EVENTS.length;i++){r-=EVENTS[i].w;if(r<=0){ev=EVENTS[i];break;}}
  var fxText=ev.fx(P,ids,rng);
  return{name:ev.name,text:ev.text,fx:fxText,big:ev.w<=2};
}
function addFatigue(P,ids,d){ids.forEach(function(id){var p=P[id];if(!p)return;p.fatigue=Math.max(0,Math.min(100,(p.fatigue==null?0:p.fatigue)+d));});}
/* AI 战术反制：最近 4 轮你反复用同一战术 ≥2 次 → 全联盟都会针对性准备（难度来源） */
function aiTactic(st,team){
  var h=(st.tacHist||[]).slice(-4);
  if(h.length>=2){
    var cnt={};h.forEach(function(t){cnt[t]=(cnt[t]||0)+1;});
    var best=null,bn=0;
    for(var k in cnt)if(cnt[k]>bn){bn=cnt[k];best=k;}
    if(bn>=2&&best){for(var t in TACTICS)if(TACTICS[t].beats===best)return t;}
  }
  return team.tactic||"engage";
}
function playSeasonRound(st,opts,seedBase){
  var events={round:st.round,matches:[],herMatch:null,awaken:null};
  var pairs=st.schedule[st.round];
  pairs.forEach(function(pr,idx){
    var tA=st.teams[pr[0]],tB=st.teams[pr[1]];
    var fiveA=teamFive(tA),fiveB=teamFive(tB);
    var rng=makeRng((seedBase+idx*7919+st.round*104729)|0);
    var tacA=tA.her?(tA.tactic||"engage"):aiTactic(st,tA);
    var tacB=tB.her?(tB.tactic||"engage"):aiTactic(st,tB);
    var m=simulateMatch(st.P,fiveA,fiveB,Object.assign({},opts,{nameA:tA.name,nameB:tB.name,tacA:tacA,tacB:tacB}),rng);
    var wTeam=m.win==="A"?tA:tB,lTeam=m.win==="A"?tB:tA;
    wTeam.W++;lTeam.L++;
    wTeam.streak=wTeam.streak>0?wTeam.streak+1:1;
    lTeam.streak=lTeam.streak<0?lTeam.streak-1:-1;
    st.mvp[m.mvpId]=(st.mvp[m.mvpId]||0)+1;
    var wIds=m.win==="A"?fiveA:fiveB;
    var minId=wIds[0];
    wIds.forEach(function(id){if(m.contrib[id]<m.contrib[minId])minId=id;});
    st.carried[minId]=(st.carried[minId]||0)+1;
    /* 只有上场选手获得比赛成长；你的队上场选手赛后压力 +4 */
    applyGrowth(st.P,fiveA.concat(fiveB),rng);
    if(tA.her||tB.her)addStress(st.P,(tA.her?fiveA:fiveB),4);
    events.matches.push({a:tA.name,b:tB.name,win:m.win,mvp:st.P[m.mvpId].name,
      diff:Math.abs(m.goldA-m.goldB),her:(tA.her||tB.her)});
    if(tA.her||tB.her){
      events.herMatch={m:m,a:tA,b:tB};
      /* 战术记录（供 AI 反制）+ 疲劳账目：上场 +12，替补 -40 */
      st.tacHist=(st.tacHist||[]);st.tacHist.push(tA.her?tacA:tacB);
      var herFive=tA.her?fiveA:fiveB;
      addFatigue(st.P,herFive,12);
      addFatigue(st.P,st.teams[0].roster.filter(function(id){return herFive.indexOf(id)<0;}),-40);
      /* 赛后随机事件：作用于全队名单（含替补），剧情与数值波动全看脸 */
      events.afterEvent=rollEvent(st.P,st.teams[0].roster,makeRng((seedBase*31+idx*977+st.round*131577)|0));
      var herRoster=tA.her?fiveA:fiveB;
      var bottomId=herRoster[0];
      herRoster.forEach(function(id){if(m.contrib[id]<m.contrib[bottomId])bottomId=id;});
      if(bottomId==="aji")st.ajiBottom=(st.ajiBottom||0)+1;
      st.herResults.push({round:st.round+1,opp:tA.her?tB.name:tA.name,
        win:(tA.her&&m.win==="A")||(tB.her&&m.win==="B"),
        mvp:st.P[m.mvpId].name,diff:Math.abs(m.goldA-m.goldB)});
    }
  });
  var her=st.teams[0];
  var byStreak=her.streak<=-5;
  var byBottom=(st.ajiBottom||0)>=5;
  if(!st.awakened&&(byStreak||byBottom)){
    st.awakened=true;st.awakenRound=st.round+1;
    var aji=st.P["aji"];
    if(aji){aji.awakened=true;aji.stats.lane+=6;aji.stats.mech+=10;aji.stats.fight+=12;aji.stats.sense+=6;aji.stats.mental+=8;}
    events.awaken=(byStreak?"队伍五连败达成":"阿鸡累计 "+st.ajiBottom+" 场队内垫底，憋不住了")+"——阿鸡在更衣室沉默了整整十分钟，然后抬头说：「下次比赛，看我的。」（属性大幅提升，成长 ×2.25）";
  }
  st.round++;
  if(st.round>=st.schedule.length)st.phase="playoffs";
  return events;
}
function simSeries(st,ta,tb,need,opts,seedBase){
  var ga=0,gb=0,games=[];
  var fa=teamFive(ta),fb=teamFive(tb);
  var tacA=ta.her?(ta.tactic||"engage"):aiTactic(st,ta);
  var tacB=tb.her?(tb.tactic||"engage"):aiTactic(st,tb);
  for(var g=1;g<=need*2-1;g++){
    var rng=makeRng((seedBase*31+g*7919)|0);
    var m=simulateMatch(st.P,fa,fb,Object.assign({},opts,{gameIdx:g,nameA:ta.name,nameB:tb.name,tacA:tacA,tacB:tacB}),rng);
    if(m.win==="A")ga++;else gb++;
    st.mvp[m.mvpId]=(st.mvp[m.mvpId]||0)+1;
    applyGrowth(st.P,fa.concat(fb),rng);
    if(ta.her||tb.her){
      addStress(st.P,(ta.her?fa:fb),4);
      addFatigue(st.P,(ta.her?fa:fb),12);
      rollEvent(st.P,(ta.her?ta:tb).roster,rng); /* 季后赛每局赛后也有随机事件 */
    }
    games.push(m);
    if(ga===need||gb===need)break;
  }
  return{winnerTeam:ga===need?ta:tb,loserTeam:ga===need?tb:ta,ga:ga,gb:gb,games:games};
}
function runPlayoffs(st,opts,seedBase){
  if(st.champion)return st.playoffLog||[];
  var rng=makeRng(seedBase);
  var order=st.teams.map(function(t){return t;}).sort(function(a,b){return b.W-a.W||(rng.next()<0.5?-1:1);});
  var top8=order.slice(0,8);
  var lines=[];
  var stageN=0;
  function stage(name,pairs,need){
    stageN++;
    var next=[];
    lines.push("==== "+name+"（BO"+(need*2-1)+"） ====");
    pairs.forEach(function(pr,idx){
      var r=simSeries(st,pr[0],pr[1],need,opts,seedBase+idx*131+stageN*977);
      var her=pr[0].her||pr[1].her;
      var mvps=r.games.map(function(m){return st.P[m.mvpId].name;}).join("、");
      lines.push(pr[0].name+" "+r.ga+" : "+r.gb+" "+pr[1].name+" ｜ 各局MVP："+mvps+(her?" ｜ ★你的系列赛":""));
      if(her){
        r.games.forEach(function(m,g){
          lines.push("　第"+(g+1)+"局 "+(m.win==="A"?pr[0].name:pr[1].name)+" 胜 · "+fmtClock(m.gameLen)+" · MVP "+st.P[m.mvpId].name+" · 经济差 "+Math.abs(m.goldA-m.goldB));
        });
      }
      next.push(r.winnerTeam);
    });
    return next;
  }
  var qf=[[top8[0],top8[7]],[top8[3],top8[4]],[top8[1],top8[6]],[top8[2],top8[5]]];
  var sf=stage("八强赛",qf,2);
  var ff=stage("半决赛",[[sf[0],sf[1]],[sf[2],sf[3]]],2);
  var champ=stage("总决赛",[[ff[0],ff[1]]],2);
  st.champion=champ[0].name;
  var her=st.teams[0];
  var herRank=order.indexOf(her)+1;
  lines.push("==== 冠军："+st.champion+" ====");
  lines.push("你的常规赛排名：第 "+herRank+" 名（"+her.W+"胜"+her.L+"负）"+(st.awakened?" · 阿鸡已于第 "+st.awakenRound+" 轮觉醒":" · 阿鸡整季未觉醒（没凑出五连败）"));
  st.phase="done";
  st.playoffLog=lines;
  return lines;
}
</script>

<script>

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function herTeam(){return SEASON?SEASON.teams[0]:null;}
function herRankNow(){
  if(!SEASON)return "-";

}
function nextOpponent(){
  if(!SEASON||SEASON.phase!=="regular")return null;
  var pairs=SEASON.schedule[SEASON.round];
  for(var i=0;i<pairs.length;i++){
    if(pairs[i][0]===0)return SEASON.teams[pairs[i][1]];
    if(pairs[i][1]===0)return SEASON.teams[pairs[i][0]];
  }
  return null;
}
function teamCore(t){
  var best=null,bi=0;
  t.roster.forEach(function(id,i){var p=SEASON.P[id];if(!best||statAvg(p)>statAvg(best)){best=p;bi=i;}});
  return{p:best,slot:SLOTS[bi]};
}
function teamAvg(){
  var s=0;
  SEASON.teams[0].roster.forEach(function(id){s+=statAvg(SEASON.P[id]);});
  return (s/SEASON.teams[0].roster.length).toFixed(1);
}
function m(label,val){return '<div class="m"><span>'+label+'</span><b>'+val+'</b></div>';}
function emptyCard(msg){return '<div class="card"><div class="empty">'+msg+'</div></div>';}

var TABS=["home","roster","league","market"];
TABS.forEach(function(t){
  $("tabbtn_"+t).addEventListener("click",function(){switchTab(t);});
});

    $("page_"+x).style.display=x===t?"grid":"none";

  $("h_rec").textContent=h.name+" "+h.W+"胜"+h.L+"负 · 第 "+herRankNow()+" 名";
}

/* ---------- 主页 ---------- */
function playerChipsCard(){
  var h='<div class="card"><p class="h3">队员状态</p><div>';
  SEASON.teams[0].roster.forEach(function(id){
    var p=SEASON.P[id];var g=statAvg(p)-(SEASON.herBase[id]||0);
    var label;
    if(p.traits.indexOf("kamikaze")>=0)label="神鬼难料";
    else if(p.traits.indexOf("slack")>=0)label=p.awakened?"已觉醒":"潜力股";

    else label="稳定";
    h+='<span class="chip">'+esc(p.name)+' · '+label+' +'+g.toFixed(1)+' · 压 '+stressHTML(p)+" · 疲 "+fatigueHTML(p)+"</span>";
  });

}

    rs.map(function(r){return '<span style="color:'+(r.win?"var(--teal)":"var(--red)")+'">'+(r.win?"胜":"负")+" "+esc(r.opp)+"</span>";}).join(" · ")+"</p></div>";
}

    '颁奖礼的彩带落下来的时候，你想：要是能重来……<br><br>'+
    '再睁眼，你回到了一切开始之前：一支网吧战队，六个群友，一个梦想。<br>'+
    '每场比赛前选五人首发、下战术指令（克制对手有加成）；连续上场会累积疲劳，轮换是必修课；<br>'+
    '每场比赛后都会发生随机事件——惊喜和惊吓，都可能有。对手也会研究你的套路。<br>'+
    'S1 城市赛：16 支队伍 · 15 轮常规赛 BO1 · 前 8 进 BO3 季后赛。<br>'+

    $("btn_start_career").addEventListener("click",function(){newSeason(false);});

  }
  var h=herTeam();

        (hard?' <span class="chip warn">'+esc(opp.tag)+" · 硬仗</span>":"")+"</p>"+
        '<p class="note" style="margin:0 0 14px">对方核心：'+esc(core.p.name)+"（"+SLOT_NAME[core.slot]+" · 总评 "+Math.round(statAvg(core.p))+"）｜ 对手战绩 "+opp.W+"胜"+opp.L+"负"+(opp.tactic&&TACTICS[opp.tactic]?"｜ 风格："+TACTICS[opp.tactic].name+"（"+TACTICS[opp.tactic].desc+"）":"")+"</p>"+

        m("战绩",h.W+" - "+h.L)+m("排名",herRankNow()+" / 16")+

  var s=p.stress==null?30:p.stress;
  var col=s>65?"var(--red)":(s>40?"#c98a00":"var(--teal)");
  return '<span style="color:'+col+';font-weight:600">'+Math.round(s)+"</span>";

function lineupHTML(t){
  var five=teamFive(t);
  var h='<div><p style="margin:0 0 6px;font-weight:500">'+esc(t.name)+(t.her?"（你）":"")+"</p>";

function gameRound(){
  if(!SEASON||SEASON.phase!=="regular")return null;

  if(!SEASON.pstats)SEASON.pstats={};
  if(ev.herMatch){
    ev.herMatch.m.box.forEach(function(b){
      var ps=SEASON.pstats[b.id]||(SEASON.pstats[b.id]={g:0,k:0,d:0,a:0,j:0,mvp:0});
      ps.g++;ps.k+=b.k;ps.d+=b.d;ps.a+=b.a;ps.j+=b.join;if(b.mvp)ps.mvp++;
    });
  }

function liveLine(l){
  var cls=l.t==="hl"?"hl":(l.t==="bl"?"bl":(l.t==="tr"?"tr":"nd"));

  el.scrollTop=el.scrollHeight;

function tick(){
  if(!LIVE||LIVE.paused)return;
  var lines=LAST_EV.herMatch.m.log;
  liveLine(lines[LIVE.i]);LIVE.i++;
  if(LIVE.i>=lines.length){finishLive();return;}
  LIVE.timer=setTimeout(tick,700);
}
function finishLive(){
  if(!LAST_EV)return;
  if(LIVE){
    if(LIVE.timer)clearTimeout(LIVE.timer);
    while(LIVE.i<LAST_EV.herMatch.m.log.length){liveLine(LAST_EV.herMatch.m.log[LIVE.i]);LIVE.i++;}
    LIVE=null;
  }
  $("livecard").style.display="block";
  $("postcard").style.display="grid";
  renderPost();
}

function renderMarket(){
  var el=$("page_market");
  if(!SEASON){el.innerHTML=emptyCard("先开一个赛季，全联盟选手都在这里");return;}
  var list=[];
  function bestSlot(p){var b=null,v=0;for(var f in p.fit){if(p.fit[f]>v){v=p.fit[f];b=f;}}return b;}
  SEASON.teams.forEach(function(t){
    t.roster.forEach(function(id,i){
      var p=SEASON.P[id];
      list.push({p:p,team:t,slot:SLOTS[i]||bestSlot(p),avg:statAvg(p),mvp:(SEASON.mvp||{})[id]||0});
    });
  });
  if(MKT.q)list=list.filter(function(x){return x.p.name.indexOf(MKT.q)>=0||x.team.name.indexOf(MKT.q)>=0;});
  if(MKT.team)list=list.filter(function(x){return x.team.name===MKT.team;});
  var sorters={
    overall:function(x){return x.avg;},potential:function(x){return x.p.potential;},
    mech:function(x){return x.p.stats.mech;},fight:function(x){return x.p.stats.fight;},
    mental:function(x){return x.p.stats.mental;},mvp:function(x){return x.mvp;}
  };
  list.sort(function(a,b){return sorters[MKT.sort](b)-sorters[MKT.sort](a);});
  var h='<div class="card"><p class="h3">选手百科 · 共 '+list.length+' 人（转会市场 S2 开放）</p>'+
  '<div class="searchrow"><input type="text" id="mkt_q" placeholder="搜名字 / 队伍" value="'+esc(MKT.q)+'">'+
  '<select id="mkt_team"><option value="">全部队伍</option>'+SEASON.teams.map(function(t){return "<option"+(MKT.team===t.name?" selected":"")+">"+esc(t.name)+"</option>";}).join("")+"</select>"+
  '<select id="mkt_sort">'+[["overall","按总评"],["potential","按潜力"],["mech","按操作"],["fight","按团战"],["mental","按心态"],["mvp","按MVP数"]].map(function(s){return '<option value="'+s[0]+'"'+(MKT.sort===s[0]?" selected":"")+">"+s[1]+"</option>";}).join("")+"</select></div>";
  if(MKT.detail){
    var d=null;
    for(var i=0;i<list.length;i++)if(list[i].p.id===MKT.detail){d=list[i];break;}
    if(d)h+=marketDetail(d);
  }
  h+='<table><tr><th>选手</th><th>队伍</th><th>位置</th><th>总评</th><th>潜力</th><th>MVP</th><th>特性</th></tr>';
  list.slice(0,100).forEach(function(x){
    h+='<tr'+(x.team.her?' class="me"':"")+' style="cursor:pointer" data-pid="'+x.p.id+'"><td>'+esc(x.p.name)+"</td><td>"+esc(x.team.name)+"</td><td>"+SLOT_NAME[x.slot]+"</td><td><b>"+x.avg.toFixed(1)+"</b></td><td>"+x.p.potential+"</td><td>"+x.mvp+"</td><td>"+(x.p.traits.map(function(t){return TRAITS[t].name;}).join("、")||"-")+"</td></tr>";
  });
  h+="</table></div>";
  el.innerHTML=h;
  $("mkt_q").addEventListener("input",function(){MKT.q=this.value;renderMarketKeepFocus();});
  $("mkt_team").addEventListener("change",function(){MKT.team=this.value;renderMarket();});
  $("mkt_sort").addEventListener("change",function(){MKT.sort=this.value;renderMarket();});
  var rows=el.querySelectorAll("tr[data-pid]");
  for(var r=0;r<rows.length;r++){
    rows[r].addEventListener("click",function(){
      MKT.detail=(MKT.detail===this.getAttribute("data-pid"))?null:this.getAttribute("data-pid");
      renderMarket();
    });
  }
}

/* ---------- 赛季管理 ---------- */
function newSeason(carry){
  var carryMap=null,awakened=false;
  if(carry&&SEASON){
    carryMap={};
    SEASON.teams[0].roster.forEach(function(id){var p=SEASON.P[id];if(p)p.stress=25;carryMap[id]=p;});
    awakened=!!(SEASON.P["aji"]&&SEASON.P["aji"].awakened);
  }
  SEASON=createSeason(DEFAULT_PLAYERS,freshSeed());
  if(carryMap){
    for(var id in carryMap)SEASON.P[id]=carryMap[id];
    SEASON.herBase={};
    SEASON.teams[0].roster.forEach(function(id2){SEASON.herBase[id2]=statAvg(SEASON.P[id2]);});
    if(awakened){SEASON.awakened=true;SEASON.awakenRound=0;}
  }
  LAST_EV=null;SHOW_NOTE=null;
  switchTab("home");
  renderHome();
}
$("btn_new").addEventListener("click",function(){
  if(SEASON&&!confirm("开始全新赛季？当前进度（含阵容成长）将清空。"))return;
  newSeason(false);
});
$("btn_wipe").addEventListener("click",function(){
  if(!confirm("清除全部存档？此操作不可恢复。"))return;
  localStorage.removeItem(SEASON_KEY);
  SEASON=null;LAST_EV=null;SHOW_NOTE=null;
  renderHome();
});

SEASON=loadSeason();
renderHome();
</script>
